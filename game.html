<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Lumi Catch Game</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff8e7;
            font-family: Arial, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background:
                linear-gradient(
                    to bottom,
                    #fffdf5,
                    #f4e8c8
                );
        }

    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Game JavaScript -->
    <script src="game.js"></script>

</body>

</html>
